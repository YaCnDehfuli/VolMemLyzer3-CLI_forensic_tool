[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volmemlyzer"
version = "3.1.0"
description = "Volatility 3-powered memory forensics: parallel plugin runs, DFIR analysis, and ML-ready features."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Yasin Dehfouli", email = "yasind@yorku.ca" }]
keywords = ["volatility", "forensics", "dfir", "memory", "malware", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "volatility3",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "python-dateutil>=2.8.2",
  "tqdm>=4.65.0",
  "rich>=13.3.0",
]

[project.urls]
Homepage = "https://github.com/YaCnDehfuli/VolMemLyzer3-CLI_forensic_tool"
Issues = "https://github.com/YaCnDehfuli/VolMemLyzer3-CLI_forensic_tool/issues"

[project.scripts]
volmemlyzer = "volmemlyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["volmemlyzer", "volmemlyzer.*"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
