# Pinned plugin set for the extract-parallelism benchmark.
# Canonical copy lives in benchmarks/run_benchmark.py as PINNED_PLUGINS.
# A different list is a different measurement — do not silently expand it.
#
# Included (registered names that finish in minutes on the 4.4GB image):
#   pslist, pstree, dlllist, cmdline, registry.hivelist, modules, svcscan,
#   getsids, privileges, envars
#
# Requested but excluded:
#   sessions           — extract_sessions_features exists; not in PLUGIN_SPECIFICS
#   hivelist           — registered as registry.hivelist (included under that name)
#   psscan, netscan    — timed out at 480s on 2580_5.vmem with empty artifacts
#
# Excluded: byte-walk / dump / pool-wide / full-image plugins
#   yarascan, strings, memmap, virtmap, dumpfiles, procdump, memdump,
#   imagecopy, malfind, filescan, poolscanner, bigpools
# and similar full-walk / heavy scanners:
#   handles, iat, vadinfo, verinfo, psxview, threads, thrdscan, deskscan,
#   mbrscan, shimcache, statistics, vadwalk, devicetree, driverscan,
#   modscan, mutantscan, registry.hivescan, symlinkscan, ldrmodules
#
# Not on the requested list (also excluded):
#   info, registry.userassist, scheduled_tasks
plugins:
  - pslist
  - pstree
  - dlllist
  - cmdline
  - registry.hivelist
  - modules
  - svcscan
  - getsids
  - privileges
  - envars
